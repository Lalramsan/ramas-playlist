<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rama's Playlist</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f4ef;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    h2 {
      margin-top: 25px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }

    .song {
      padding: 14px;
      margin: 10px 0;
      background: #f3f3f3;
      border-radius: 10px;
      font-size: 17px;
    }

    .artist {
      color: #777;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎤 Rama's Playlist</h1>

    <div class="subtitle">
      Songs I perform for my guests 🎶
    </div>

    <h2>🇬🇧 English</h2>

    <div class="song">
      🎵 Perfect
      <div class="artist">Ed Sheeran</div>
    </div>

    <div class="song">
      🎵 Take Me Home, Country Roads
      <div class="artist">John Denver</div>
    </div>

    <div class="song">
      🎵 Let It Be
      <div class="artist">The Beatles</div>
    </div>

    <h2>🇮🇳 Hindi</h2>

    <div class="song">
      🎵 Jab Koi Baat
    </div>

    <div class="song">
      🎵 Ajeeb Dastaan Hai Yeh
    </div>

    <div class="song">
      🎵 Jeena Jeena
    </div>

    <div class="footer">
      Thank you for listening ❤️
    </div>

  </div>

</body>
</html>
